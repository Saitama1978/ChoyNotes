name: Build ChoyNotes APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. I-checkout ang code mo mula sa repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. I-setup ang Java Development Kit (JDK) na kailangan ng Android
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. I-setup ang pinakabagong bersyon ng Flutter
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # 4. I-download ang lahat ng dependencies/packages ng ChoyNotes
    - name: Install Dependencies
      run: flutter pub get

    # 5. Simulan ang pag-build ng APK (Release version)
    - name: Build APK
      run: flutter build apk --release

    # 6. I-upload ang APK para ma-download mo sa iyong phone
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChoyNotes-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
