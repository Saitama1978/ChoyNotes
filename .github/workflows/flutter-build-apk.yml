name: Build ChoyNotes APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Nuke and Recreate Clean Project Environment
      run: |
        rm -rf android ios web windows macos linux
        flutter create . --org com.choynotes.app --project-name choynotes

    - name: Inject Ultimate All-In-One ChoyNotes App Code with Notta AI Tab 2
      run: |
        cat << 'EOF' > lib/main.dart
        import 'dart:io';
        import 'dart:async';
        import 'package:flutter/material.dart';
        import 'package:speech_to_text/speech_to_text.dart' as stt;
        import 'package:permission_handler/permission_handler.dart';
        import 'package:path_provider/path_provider.dart';
        import 'package:google_generative_ai/google_generative_ai.dart';

        void main() {
          runApp(const ChoyNotesApp());
        }

        class ChoyNotesApp extends StatefulWidget {
          const ChoyNotesApp({super.key});

          @override
          State<ChoyNotesApp> createState() => _ChoyNotesAppState();
        }

        class _ChoyNotesAppState extends State<ChoyNotesApp> {
          bool _isDarkMode = true;

          void toggleTheme() {
            setState(() {
              _isDarkMode = !_isDarkMode;
            });
          }

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              title: 'ChoyNotes Pro',
              debugShowCheckedModeBanner: false,
              themeMode: _isDarkMode ? ThemeMode.dark : ThemeMode.light,
              theme: ThemeData(
                useMaterial3: true,
                colorScheme: ColorScheme.fromSeed(
                  seedColor: const Color(0xFF0F172A),
                  brightness: Brightness.light,
                ),
                scaffoldBackgroundColor: const Color(0xFFF8FAFC),
              ),
              darkTheme: ThemeData(
                useMaterial3: true,
                colorScheme: ColorScheme.fromSeed(
                  seedColor: const Color(0xFF0F172A),
                  brightness: Brightness.dark,
                ),
                scaffoldBackgroundColor: const Color(0xFF0F172A),
              ),
              home: HomeScreen(onThemeToggle: toggleTheme, isDarkMode: _isDarkMode),
            );
          }
        }

        class HomeScreen extends StatefulWidget {
          final VoidCallback onThemeToggle;
          final bool isDarkMode;
          const HomeScreen({super.key, required this.onThemeToggle, required this.isDarkMode});

          @override
          State<HomeScreen> createState() => _HomeScreenState();
        }

        class _HomeScreenState extends State<HomeScreen> {
          late stt.SpeechToText _speech;
          bool _isListening = false;
          bool _shouldBeListening = false;

          final TextEditingController _textController = TextEditingController();
          final TextEditingController _searchController = TextEditingController();
          final TextEditingController _aiQueryController = TextEditingController();

          String _finalizedText = "";
          String _interimText = "";
          String _aiResponse = "";
          bool _isAiLoading = false;

          String _selectedCategory = 'General';
          final List<String> _categories = ['General', 'School', 'Work', 'Personal'];
          List<Map<String, String>> _savedNotes = [];
          List<Map<String, String>> _filteredNotes = [];

          // ⚠️ Pwede mo itong palitan ng iyong Gemini API Key bukas paggising mo
          final String _geminiApiKey = "PALITAN_ITO_NG_IYONG_API_KEY";

          @override
          void initState() {
            super.initState();
            _speech = stt.SpeechToText();
            _loadNotes();
            _searchController.addListener(_filterNotes);
          }

          void _filterNotes() {
            String query = _searchController.text.toLowerCase();
            setState(() {
              if (query.isEmpty) {
                _filteredNotes = List.from(_savedNotes);
              } else {
                _filteredNotes = _savedNotes.where((note) {
                  return (note['text'] ?? '').toLowerCase().contains(query);
                }).toList();
              }
            });
          }

          void _askAI(String contextText, String userQuestion) async {
            if (_geminiApiKey == "PALITAN_ITO_NG_IYONG_API_KEY" || _geminiApiKey.isEmpty) {
              setState(() {
                _aiResponse = "Pakilagay muna ang iyong Gemini API Key sa code bukas.";
              });
              return;
            }
            if (contextText.isEmpty) {
              setState(() {
                _aiResponse = "Walang nakasulat na text na pwedeng suriin ng AI.";
              });
              return;
            }

            setState(() {
              _isAiLoading = true;
              _aiResponse = "Nag-iisip ang AI...";
            });

            try {
              final model = GenerativeModel(model: 'gemini-1.5-flash', apiKey: _geminiApiKey);
              final prompt = "Ito ang aking note o transkripsyon:\n$contextText\n\nBatay sa note sa itaas, sagutin ang tanong: $userQuestion";
              final content = [Content.text(prompt)];
              final response = await model.generateContent(content);
              setState(() {
                _aiResponse = response.text ?? "Walang sagot mula sa AI.";
              });
            } catch (e) {
              setState(() {
                _aiResponse = "Error sa AI: $e";
              });
            } finally {
              setState(() {
                _isAiLoading = false;
              });
            }
          }

          void _initAndStartSpeech() async {
            bool available = await _speech.initialize(
              onError: (val) {
                if (_shouldBeListening) _startListeningLoop();
              },
              onStatus: (status) {
                if (status == 'notListening' && _shouldBeListening) {
                  if (_interimText.isNotEmpty) {
                    _finalizedText = "$_finalizedText $_interimText".trim();
                    _interimText = "";
                  }
                  _startListeningLoop();
                }
              },
            );

            if (available) {
              setState(() {
                _isListening = true;
                _shouldBeListening = true;
              });
              _startListeningLoop();
            }
          }

          void _startListeningLoop() async {
            if (!_shouldBeListening) return;
            await _speech.listen(
              onResult: (val) {
                setState(() {
                  _interimText = val.recognizedWords;
                  _textController.text = _finalizedText.isEmpty ? _interimText : "$_finalizedText $_interimText";
                  _textController.selection = TextSelection.fromPosition(TextPosition(offset: _textController.text.length));
                });
              },
              listenFor: const Duration(hours: 1),
              pauseFor: const Duration(seconds: 4),
              partialResults: true,
              listenMode: stt.ListenMode.dictation,
            );
          }

          void _listen() async {
            if (!_isListening) {
              var status = await Permission.microphone.request();
              if (status.isGranted) {
                _textController.clear();
                _finalizedText = "";
                _interimText = "";
                _initAndStartSpeech();
              }
            } else {
              setState(() {
                _isListening = false;
                _shouldBeListening = false;
                if (_interimText.isNotEmpty) _finalizedText = "$_finalizedText $_interimText".trim();
                _textController.text = _finalizedText;
              });
              await _speech.stop();
            }
          }

          void _saveNote() async {
            String txt = _textController.text.trim();
            if (txt.isEmpty) return;

            setState(() {
              _savedNotes.insert(0, {
                'text': txt,
                'category': _selectedCategory,
                'date': "${DateTime.now().day}/${DateTime.now().month}/${DateTime.now().year}"
              });
              _filteredNotes = List.from(_savedNotes);
              _textController.clear();
              _finalizedText = "";
              _interimText = "";
            });

            final directory = await getApplicationDocumentsDirectory();
            final file = File('${directory.path}/choynotes_pro.txt');
            List<String> rawLines = _savedNotes.map((n) => "${n['category']}|${n['date']}|${n['text']}").toList();
            await file.writeAsString(rawLines.join('\n===\n'));

            ScaffoldMessenger.of(context).showSnackBar(
              const SnackBar(content: Text('Transcript successfully saved!')),
            );
          }

          void _loadNotes() async {
            try {
              final directory = await getApplicationDocumentsDirectory();
              final file = File('${directory.path}/choynotes_pro.txt');
              if (await file.exists()) {
                String contents = await file.readAsString();
                if (contents.trim().isEmpty) return;
                List<String> blocks = contents.split('\n===\n');
                List<Map<String, String>> loaded = [];
                for (var block in blocks) {
                  var parts = block.split('|');
                  if (parts.length >= 3) {
                    loaded.add({'category': parts[0], 'date': parts[1], 'text': parts.sublist(2).join('|')});
                  }
                }
                setState(() {
                  _savedNotes = loaded;
                  _filteredNotes = List.from(_savedNotes);
                });
              }
            } catch (e) {
              print(e);
            }
          }

          @override
          void dispose() {
            _textController.dispose();
            _searchController.dispose();
            _aiQueryController.dispose();
            super.dispose();
          }

          @override
          Widget build(BuildContext context) {
            bool isDark = widget.isDarkMode;

            return DefaultTabController(
              length: 2,
              child: Scaffold(
                appBar: AppBar(
                  title: const Text('ChoyNotes Pro', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                  centerTitle: true,
                  elevation: 0,
                  actions: [
                    IconButton(
                      icon: Icon(isDark ? Icons.wb_sunny : Icons.nightlight_round, color: Colors.white),
                      onPressed: widget.onThemeToggle,
                    ),
                  ],
                  bottom: const TabBar(
                    labelColor: Colors.blueAccent,
                    unselectedLabelColor: Colors.white60,
                    indicatorColor: Colors.blueAccent,
                    tabs: [
                      Tab(icon: Icon(Icons.mic, color: Colors.white), text: "Transcribe"),
                      Tab(icon: Icon(Icons.psychology, color: Colors.white), text: "AI Assistant"),
                    ],
                  ),
                ),
                body: Column(
                  children: [
                    Container(
                      padding: const EdgeInsets.symmetric(vertical: 8.0),
                      width: double.infinity,
                      color: isDark ? const Color(0xFF1E293B) : Colors.grey.shade200,
                      child: Text(
                        "Program by: Renante Fullo",
                        textAlign: TextAlign.center,
                        style: TextStyle(color: isDark ? Colors.white70 : Colors.black87, fontSize: 14, fontWeight: FontWeight.w500),
                      ),
                    ),
                    Expanded(
                      child: TabBarView(
                        children: [
                          // --- TAB 1: TRANSCRIBE ---
                          SingleChildScrollView(
                            child: Padding(
                              padding: const EdgeInsets.all(16.0),
                              child: Column(
                                children: [
                                  Row(
                                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                    children: [
                                      Text("Select Category:", style: TextStyle(fontSize: 16, color: isDark ? Colors.white : Colors.black87, fontWeight: FontWeight.w500)),
                                      DropdownButton<String>(
                                        value: _selectedCategory,
                                        dropdownColor: isDark ? const Color(0xFF1E293B) : Colors.white,
                                        style: TextStyle(color: isDark ? Colors.white : Colors.black87),
                                        items: _categories.map((String value) {
                                          return DropdownMenuItem<String>(value: value, child: Text(value));
                                        }).toList(),
                                        onChanged: (newValue) => setState(() => _selectedCategory = newValue!),
                                      ),
                                    ],
                                  ),
                                  const SizedBox(height: 16),
                                  Container(
                                    height: 180,
                                    padding: const EdgeInsets.all(12),
                                    decoration: BoxDecoration(
                                      border: Border.all(color: isDark ? Colors.white60 : Colors.black38),
                                      borderRadius: BorderRadius.circular(16),
                                      color: isDark ? Colors.transparent : Colors.white,
                                    ),
                                    child: TextField(
                                      controller: _textController,
                                      maxLines: null,
                                      readOnly: _isListening,
                                      style: TextStyle(color: isDark ? Colors.white : Colors.black87, fontSize: 16),
                                      decoration: InputDecoration(
                                        border: InputBorder.none,
                                        hintText: "Tap the microphone below and speak to transcribe...",
                                        hintStyle: TextStyle(color: isDark ? Colors.white38 : Colors.black38),
                                      ),
                                    ),
                                  ),
                                  const SizedBox(height: 16),
                                  SizedBox(
                                    width: double.infinity,
                                    height: 50,
                                    child: ElevatedButton.icon(
                                      onPressed: _saveNote,
                                      icon: const Icon(Icons.bookmark, color: Colors.white),
                                      label: const Text("Save Transcript", style: TextStyle(fontSize: 16, color: Colors.white)),
                                      style: ElevatedButton.styleFrom(
                                        backgroundColor: const Color(0xFF3B82F6),
                                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                                      ),
                                    ),
                                  ),
                                  const SizedBox(height: 16),
                                  TextField(
                                    controller: _searchController,
                                    style: TextStyle(color: isDark ? Colors.white : Colors.black87),
                                    decoration: InputDecoration(
                                      prefixIcon: Icon(Icons.search, color: isDark ? Colors.white60 : Colors.black45),
                                      hintText: "Search notes...",
                                      hintStyle: TextStyle(color: isDark ? Colors.white38 : Colors.black38),
                                      fillColor: isDark ? Colors.transparent : Colors.white,
                                      filled: true,
                                      enabledBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide(color: isDark ? Colors.white60 : Colors.black38)),
                                      focusedBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: const BorderSide(color: Colors.blueAccent)),
                                    ),
                                  ),
                                  const SizedBox(height: 20),
                                  _filteredNotes.isEmpty
                                      ? const Padding(padding: EdgeInsets.only(top: 40.0), child: Text("No notes found.", style: TextStyle(color: Colors.grey)))
                                      : ListView.builder(
                                          shrinkWrap: true,
                                          physics: const NeverScrollableScrollPhysics(),
                                          itemCount: _filteredNotes.length,
                                          itemBuilder: (context, index) {
                                            final item = _filteredNotes[index];
                                            return Card(
                                              color: isDark ? const Color(0xFF1E293B) : Colors.white,
                                              child: ListTile(
                                                title: Text(item['text'] ?? '', maxLines: 1, overflow: TextOverflow.ellipsis, style: TextStyle(color: isDark ? Colors.white : Colors.black87)),
                                                subtitle: Text("${item['category']} • ${item['date']}", style: const TextStyle(color: Colors.grey)),
                                                trailing: const Icon(Icons.arrow_forward_ios, size: 14),
                                                onTap: () {
                                                  setState(() {
                                                    _textController.text = item['text'] ?? '';
                                                    _finalizedText = item['text'] ?? '';
                                                    _aiResponse = "Naka-load na ang note. Magpunta sa AI Assistant Tab.";
                                                  });
                                                },
                                              ),
                                            );
                                          },
                                        ),
                                ],
                              ),
                            ),
                          ),

                          // --- TAB 2: AI ASSISTANT ---
                          Padding(
                            padding: const EdgeInsets.all(16.0),
                            child: Column(
                              children: [
                                Expanded(
                                  child: Container(
                                    width: double.infinity,
                                    padding: const EdgeInsets.all(16),
                                    decoration: BoxDecoration(color: isDark ? const Color(0xFF1E293B) : Colors.white, borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.grey.shade300)),
                                    child: SingleChildScrollView(
                                      child: Column(
                                        crossAxisAlignment: CrossAxisAlignment.start,
                                        children: [
                                          const Text("Sagot ng AI:", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.blueAccent, fontSize: 16)),
                                          const Divider(),
                                          _isAiLoading 
                                            ? const Center(child: Padding(padding: EdgeInsets.only(top: 20), child: CircularProgressIndicator()))
                                            : Text(_aiResponse.isEmpty ? "Pumili ng note o mag-transcribe muna, tapos magtanong ka rito." : _aiResponse, style: TextStyle(fontSize: 15, color: isDark ? Colors.white : Colors.black87, height: 1.5)),
                                        ],
                                      ),
                                    ),
                                  ),
                                ),
                                const SizedBox(height: 12),
                                Row(
                                  mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                                  children: [
                                    ElevatedButton.icon(onPressed: () => _askAI(_textController.text, "Ibigay ang buod ng text na ito sa maiikling bullet points."), icon: const Icon(Icons.summarize), label: const Text("I-Summary")),
                                    ElevatedButton.icon(onPressed: () => _askAI(_textController.text, "Ano ang mahahalagang Action Items dito?"), icon: const Icon(Icons.task_alt), label: const Text("Action Items")),
                                  ],
                                ),
                                const SizedBox(height: 12),
                                Row(
                                  children: [
                                    Expanded(
                                      child: TextField(
                                        controller: _aiQueryController,
                                        style: TextStyle(color: isDark ? Colors.white : Colors.black87),
                                        decoration: InputDecoration(
                                          hintText: "Magtanong sa AI...",
                                          hintStyle: const TextStyle(color: Colors.grey),
                                          fillColor: isDark ? const Color(0xFF0F172A) : Colors.grey.shade200,
                                          filled: true,
                                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(30), borderSide: BorderSide.none),
                                          contentPadding: const EdgeInsets.symmetric(horizontal: 20, vertical: 10),
                                        ),
                                      ),
                                    ),
                                    const SizedBox(width: 8),
                                    IconButton(
                                      icon: const Icon(Icons.send, color: Colors.blueAccent),
                                      onPressed: () {
                                        if (_aiQueryController.text.trim().isNotEmpty) {
                                          _askAI(_textController.text, _aiQueryController.text.trim());
                                          _aiQueryController.clear();
                                        }
                                      },
                                    )
                                  ],
                                ),
                              ],
                            ),
                          ),
                        ],
                      ),
                    ),
                    Container(
                      padding: const EdgeInsets.only(bottom: 24),
                      child: Center(
                        child: GestureDetector(
                          onTap: _listen,
                          child: Container(
                            padding: const EdgeInsets.all(16),
                            decoration: BoxDecoration(
                              color: _isListening ? Colors.red : const Color(0xFF0F172A),
                              shape: BoxShape.circle,
                              boxShadow: const [BoxShadow(color: Colors.black26, blurRadius: 10, offset: Offset(0, 4))],
                            ),
                            child: Icon(_isListening ? Icons.stop : Icons.mic, size: 30, color: Colors.white),
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
              ),
            );
          }
        }
        EOF

    - name: Inject Packages into pubspec.yaml
      run: |
        flutter pub add permission_handler path_provider speech_to_text google_generative_ai

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/artifacts-upload@v4
      with:
        name: choynotes-pro-apk
        path: build/app/outputs/flutter-apk/app-release.apk
