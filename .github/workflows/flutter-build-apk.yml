name: Build ChoyNotes APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Auto-generate Clean Android Project
      run: flutter create . --overwrite --org com.choynotes.app

    - name: Inject Clean ChoyNotes App Code
      run: |
        cat << 'EOF' > lib/main.dart
        import 'dart:io';
        import 'package:flutter/material.dart';
        import 'package:permission_handler/permission_handler.dart';
        import 'package:path_provider/path_provider.dart';
        import 'package:speech_to_text/speech_to_text.dart';

        void main() {
          runApp(const ChoyNotesApp());
        }

        class ChoyNotesApp extends StatelessWidget {
          const ChoyNotesApp({super.key});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              title: 'ChoyNotes',
              debugShowCheckedModeBanner: false,
              theme: ThemeData(
                colorScheme: ColorScheme.fromSeed(seedColor: Colors.blueAccent),
                useMaterial3: true,
              ),
              home: const HomeScreen(),
            );
          }
        }

        class HomeScreen extends StatefulWidget {
          const HomeScreen({super.key});

          @override
          State<HomeScreen> createState() => _HomeScreenState();
        }

        class _HomeScreenState extends State<HomeScreen> {
          final SpeechToText _speechToText = SpeechToText();
          bool _isListening = false;
          String _wordsSpoken = "Pindutin ang mic sa ibaba at magsalita para awtomatikong mag-sulat...";
          List<String> _savedNotes = [];

          @override
          void initState() {
            super.initState();
            _initSpeech();
            _loadNotes();
          }

          void _initSpeech() async {
            try {
              await _speechToText.initialize();
            } catch (e) {
              print("Speech init error: $e");
            }
          }

          void _startListening() async {
            var status = await Permission.microphone.request();
            if (status.isGranted) {
              bool available = await _speechToText.initialize();
              if (available) {
                setState(() {
                  _isListening = true;
                  _wordsSpoken = "Nakikinig na... Magsalita ka lang.";
                });
                await _speechToText.listen(
                  onResult: (result) {
                    setState(() {
                      _wordsSpoken = result.recognizedWords;
                    });
                  },
                );
              }
            } else {
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('Kailangan ng permiso sa Mic para makapagsulat.')),
              );
            }
          }

          void _stopListening() async {
            await _speechToText.stop();
            setState(() {
              _isListening = false;
            });
          }

          void _saveNote() async {
            if (_wordsSpoken.isEmpty || _wordsSpoken.startsWith("Pindutin") || _wordsSpoken.startsWith("Nakikinig")) return;

            setState(() {
              _savedNotes.add(_wordsSpoken);
              _wordsSpoken = "Pindutin ang mic sa ibaba at magsalita para awtomatikong mag-sulat...";
            });

            final directory = await getApplicationDocumentsDirectory();
            final file = File('${directory.path}/choynotes_saved.txt');
            await file.writeAsString(_savedNotes.join('\n---\n'));

            ScaffoldMessenger.of(context).showSnackBar(
              const SnackBar(content: Text('Na-save na ang iyong transcript note!')),
            );
          }

          void _loadNotes() async {
            try {
              final directory = await getApplicationDocumentsDirectory();
              final file = File('${directory.path}/choynotes_saved.txt');
              if (await file.exists()) {
                String contents = await file.readAsString();
                setState(() {
                  _savedNotes = contents.split('\n---\n').where((s) => s.trim().isNotEmpty).toList();
                });
              }
            } catch (e) {
              print("Error loading notes: $e");
            }
          }

          void _openNote(String content, int index) {
            showDialog(
              context: context,
              builder: (context) => AlertDialog(
                title: Text('Meeting Note #${index + 1}'),
                content: SingleChildScrollView(
                  child: Text(content, style: const TextStyle(fontSize: 16)),
                ),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.pop(context),
                    child: const Text('Isara'),
                  ),
                ],
              ),
            );
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(
                title: const Text('ChoyNotes - AI Recorder', style: TextStyle(fontWeight: FontWeight.bold)),
                backgroundColor: Colors.blueAccent,
                foregroundColor: Colors.white,
                centerTitle: true,
              ),
              body: Column(
                children: [
                  Expanded(
                    flex: 3,
                    child: Container(
                      padding: const EdgeInsets.all(16),
                      margin: const EdgeInsets.all(16),
                      width: double.infinity,
                      decoration: BoxDecoration(
                        color: Colors.grey[100],
                        border: Border.all(color: Colors.blueAccent.withOpacity(0.5)),
                        borderRadius: BorderRadius.circular(12),
                      ),
                      child: SingleChildScrollView(
                        child: Text(
                          _wordsSpoken,
                          style: const TextStyle(fontSize: 18, color: Colors.black87),
                        ),
                      ),
                    ),
                  ),
                  Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 16.0),
                    child: SizedBox(
                      width: double.infinity,
                      height: 50,
                      child: ElevatedButton.icon(
                        onPressed: _isListening ? null : _saveNote,
                        icon: const Icon(Icons.save),
                        label: const Text('I-save ang Note', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                        style: ElevatedButton.styleFrom(
                          backgroundColor: Colors.green,
                          foregroundColor: Colors.white,
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8)),
                        ),
                      ),
                    ),
                  ),
                  const SizedBox(height: 10),
                  const Divider(),
                  const Padding(
                    padding: EdgeInsets.all(8.0),
                    child: Text('Mga Na-save na Notes:', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                  ),
                  Expanded(
                    flex: 3,
                    child: _savedNotes.isEmpty
                        ? const Center(child: Text('Wala pang na-save na notes.', style: TextStyle(color: Colors.grey)))
                        : ListView.builder(
                            itemCount: _savedNotes.length,
                            itemBuilder: (context, index) {
                              return Card(
                                margin: const EdgeInsets.symmetric(horizontal: 16, vertical: 4),
                                elevation: 2,
                                child: ListTile(
                                  title: Text(_savedNotes[index], maxLines: 1, overflow: TextOverflow.ellipsis),
                                  subtitle: Text("Pindutin para buksan ang buong detalye"),
                                  leading: const Icon(Icons.note_alt, color: Colors.blueAccent),
                                  trailing: const Icon(Icons.arrow_forward_ios, size: 16),
                                  onTap: () => _openNote(_savedNotes[index], index),
                                ),
                              );
                            },
                          ),
                  ),
                  const SizedBox(height: 80),
                ],
              ),
              floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
              floatingActionButton: FloatingActionButton.large(
                onPressed: _isListening ? _stopListening : _startListening,
                backgroundColor: _isListening ? Colors.red : Colors.blueAccent,
                child: Icon(_isListening ? Icons.stop : Icons.mic, color: Colors.white, size: 36),
              ),
            );
          }
        }
        EOF

    - name: Inject Safe pubspec.yaml
      run: |
        cat << 'EOF' > pubspec.yaml
        name: choynotes
        description: "An AI-powered meeting recorder app."
        publish_to: 'none'
        version: 1.0.0+1

        environment:
          sdk: '>=3.0.0 <4.0.0'

        dependencies:
          flutter:
            sdk: flutter
          cupertino_icons: ^1.0.6
          permission_handler: ^11.3.1
          path_provider: ^2.1.3
          speech_to_text: ^6.6.2

        dev_dependencies:
          flutter_test:
            sdk: flutter
          flutter_lints: ^3.0.0
          flutter_launcher_icons: ^0.13.1

        flutter:
          uses-material-design: true

        flutter_launcher_icons:
          android: "launcher_icon"
          image_path: "app_icon.png"
        EOF

    - name: Setup Android Permissions & Speech Recognizer Configuration
      run: |
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
        sed -i '/<application/a \        <queries>\n            <intent>\n                <action android:name="android.speech.RecognitionService" />\n            </intent>\n        </queries>' android/app/src/main/AndroidManifest.xml

    - name: Install Safe Dependencies
      run: flutter pub get

    - name: Fix Modern Android Gradle Repository Conflict
      run: |
        find ~/.pub-cache/hosted/pub.dev/speech_to_text-* -name "build.gradle" -exec sed -i '/jcenter()/d' {} +

    - name: Generate Custom Launcher Icons
      run: flutter pub run flutter_launcher_icons

    - name: Build Clean APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChoyNotes-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
