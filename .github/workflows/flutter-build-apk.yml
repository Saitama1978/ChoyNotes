name: Build ChoyNotes APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # UTOS PARA KUSA NGYANG LIKHAIN ANG KULANG NA ANDROID AT GRADLE FILES
    - name: Auto-generate Missing Android Files
      run: flutter create . --overwrite

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChoyNotes-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
