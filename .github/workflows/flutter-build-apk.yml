name: Build ChoyNotes APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Auto-generate Clean Modern Android Project
      run: flutter create . --overwrite --org com.choynotes.app

    - name: Inject Premium UI ChoyNotes App Code
      run: |
        cat << 'EOF' > lib/main.dart
        import 'dart:io';
        import 'package:flutter/material.dart';
        import 'package:permission_handler/permission_handler.dart';
        import 'package:path_provider/path_provider.dart';
        import 'package:speech_to_text/speech_to_text.dart';
        import 'package:share_plus/share_plus.dart';
        import 'package:intl/intl.dart';

        void main() {
          runApp(const ChoyNotesApp());
        }

        class ChoyNotesApp extends StatelessWidget {
          const ChoyNotesApp({super.key});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              title: 'ChoyNotes',
              debugShowCheckedModeBanner: false,
              theme: ThemeData(
                useMaterial3: true,
                colorScheme: ColorScheme.fromSeed(
                  seedColor: const Color(0xFF0F172A),
                  brightness: Brightness.light,
                ),
                scaffoldBackgroundColor: const Color(0xFFF8FAFC),
              ),
              home: const HomeScreen(),
            );
          }
        }

        class HomeScreen extends StatefulWidget {
          const HomeScreen({super.key});

          @override
          State<HomeScreen> createState() => _HomeScreenState();
        }

        class _HomeScreenState extends State<HomeScreen> {
          final SpeechToText _speechToText = SpeechToText();
          bool _isListening = false;
          String _wordsSpoken = "Pindutin ang mikropono sa ibaba at magsalita upang mag-transcribe...";
          List<String> _savedNotes = [];

          @override
          void initState() {
            super.initState();
            _initSpeech();
            _loadNotes();
          }

          void _initSpeech() async {
            try {
              await _speechToText.initialize();
            } catch (e) {
              debugPrint("Speech init error: $e");
            }
          }

          void _startListening() async {
            var status = await Permission.microphone.request();
            if (status.isGranted) {
              bool available = await _speechToText.initialize();
              if (available) {
                setState(() {
                  _isListening = true;
                  _wordsSpoken = "Nakikinig na nang mabuti... Magsalita ka lang.";
                });
                await _speechToText.listen(
                  onResult: (result) {
                    setState(() {
                      _wordsSpoken = result.recognizedWords;
                    });
                  },
                );
              }
            } else {
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('Kailangan ng permiso sa Mic para makapagsulat.')),
              );
            }
          }

          void _stopListening() async {
            await _speechToText.stop();
            setState(() {
              _isListening = false;
            });
          }

          void _saveNote() async {
            if (_wordsSpoken.isEmpty || 
                _wordsSpoken.startsWith("Pindutin") || 
                _wordsSpoken.startsWith("Nakikinig na")) return;

            // Gumagawa ng magandang timestamp (Halimbawa: Jun 21, 2026 • 11:42 AM)
            final String timestamp = DateFormat('MMM dd, yyyy • hh:mm a').format(DateTime.now());
            final String formattedNote = "$timestamp===$_wordsSpoken";

            setState(() {
              _savedNotes.insert(0, formattedNote);
              _wordsSpoken = "Pindutin ang mikropono sa ibaba at magsalita upang mag-transcribe...";
            });

            final directory = await getApplicationDocumentsDirectory();
            final file = File('${directory.path}/choynotes_saved.txt');
            await file.writeAsString(_savedNotes.join('\n---\n'));

            ScaffoldMessenger.of(context).showSnackBar(
              const SnackBar(
                content: Text('Matagumpay na nai-save ang iyong transcript!'),
                backgroundColor: Color(0xFF10B981),
              ),
            );
          }

          void _loadNotes() async {
            try {
              final directory = await getApplicationDocumentsDirectory();
              final file = File('${directory.path}/choynotes_saved.txt');
              if (await file.exists()) {
                String contents = await file.readAsString();
                setState(() {
                  _savedNotes = contents.split('\n---\n').where((s) => s.trim().isNotEmpty).toList();
                });
              }
            } catch (e) {
              debugPrint("Error loading notes: $e");
            }
          }

          void _deleteNote(int index) async {
            setState(() {
              _savedNotes.removeAt(index);
            });
            final directory = await getApplicationDocumentsDirectory();
            final file = File('${directory.path}/choynotes_saved.txt');
            await file.writeAsString(_savedNotes.join('\n---\n'));
            
            ScaffoldMessenger.of(context).showSnackBar(
              const SnackBar(content: Text('Deleted note.'), backgroundColor: Colors.redAccent),
            );
          }

          void _openNote(String date, String text) {
            showDialog(
              context: context,
              builder: (context) => AlertDialog(
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                title: Row(
                  children: [
                    const Icon(Icons.event_note, color: Color(0xFF3B82F6)),
                    const SizedBox(width: 8),
                    Text(date, style: const TextStyle(fontSize: 14, color: Color(0xFF64748B))),
                  ],
                ),
                content: SingleChildScrollView(
                  child: Text(text, style: const TextStyle(fontSize: 16, color: Color(0xFF1E293B), height: 1.6)),
                ),
                actions: [
                  IconButton(
                    icon: const Icon(Icons.share_outlined, color: Color(0xFF3B82F6)),
                    onPressed: () => Share.share(text),
                  ),
                  TextButton(
                    onPressed: () => Navigator.pop(context),
                    child: const Text('Isara', style: TextStyle(color: Color(0xFF3B82F6), fontWeight: FontWeight.bold)),
                  ),
                ],
              ),
            );
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(
                title: const Text('ChoyNotes Pro', style: TextStyle(fontWeight: FontWeight.w800, letterSpacing: 0.5)),
                backgroundColor: const Color(0xFF0F172A),
                foregroundColor: Colors.white,
                centerTitle: true,
                elevation: 0,
              ),
              body: Column(
                children: [
                  // DEVELOPER PROFILE BANNER
                  Container(
                    width: double.infinity,
                    padding: const EdgeInsets.symmetric(vertical: 12, horizontal: 16),
                    decoration: const BoxDecoration(
                      color: Color(0xFF1E293B),
                      borderRadius: BorderRadius.only(
                        bottomLeft: Radius.circular(16),
                        bottomRight: Radius.circular(16),
                      ),
                    ),
                    child: Row(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(Icons.star, color: Colors.amber, size: 16),
                        const SizedBox(width: 6),
                        RichText(
                          text: const TextSpan(
                            text: 'Architected by: ',
                            style: TextStyle(color: Color(0xFF94A3B8), fontSize: 13),
                            children: [
                              TextSpan(
                                text: 'Renante',
                                style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13),
                              ),
                            ],
                          ),
                        ),
                      ],
                    ),
                  ),

                  // LIVE TRANSCRIPT DISPLAY CARD
                  Expanded(
                    flex: 3,
                    child: Container(
                      padding: const EdgeInsets.all(20),
                      margin: const EdgeInsets.all(16),
                      width: double.infinity,
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(20),
                        boxShadow: [
                          BoxShadow(
                            color: Colors.black.withOpacity(0.03),
                            blurRadius: 15,
                            offset: const Offset(0, 5),
                          )
                        ],
                        border: Border.all(color: const Color(0xFFE2E8F0)),
                      ),
                      child: SingleChildScrollView(
                        physics: const BouncingScrollPhysics(),
                        child: Text(
                          _wordsSpoken,
                          style: TextStyle(
                            fontSize: 17, 
                            color: _wordsSpoken.startsWith("Pindutin") ? const Color(0xFF94A3B8) : const Color(0xFF1E293B),
                            height: 1.6,
                          ),
                        ),
                      ),
                    ),
                  ),

                  // ACTIONS BUTTON
                  Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 16.0),
                    child: SizedBox(
                      width: double.infinity,
                      height: 54,
                      child: ElevatedButton.icon(
                        onPressed: _isListening ? null : _saveNote,
                        icon: const Icon(Icons.bookmark_add_outlined, size: 20),
                        label: const Text('I-save ang Transcript', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                        style: ElevatedButton.styleFrom(
                          backgroundColor: const Color(0xFF3B82F6),
                          foregroundColor: Colors.white,
                          elevation: 0,
                          disabledBackgroundColor: const Color(0xFFE2E8F0),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                        ),
                      ),
                    ),
                  ),

                  const SizedBox(height: 16),
                  
                  // SECTION LABEL
                  Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 20.0, vertical: 4.0),
                    child: Row(
                      children: [
                        const Text(
                          'MGA KASALUKUYANG TALA', 
                          style: TextStyle(fontWeight: FontWeight.w700, fontSize: 12, color: Color(0xFF64748B), letterSpacing: 1.0),
                        ),
                        const SizedBox(width: 8),
                        Container(
                          padding: const EdgeInsets.symmetric(horizontal: 7, vertical: 2),
                          decoration: BoxDecoration(color: const Color(0xFFEDF2F7), borderRadius: BorderRadius.circular(10)),
                          child: Text('${_savedNotes.length}', style: const TextStyle(fontSize: 11, fontWeight: FontWeight.bold, color: Color(0xFF4A5568))),
                        )
                      ],
                    ),
                  ),

                  // LIST VIEW OF NOTES
                  Expanded(
                    flex: 4,
                    child: _savedNotes.isEmpty
                        ? Center(
                            child: Column(
                              mainAxisAlignment: MainAxisAlignment.center,
                              children: [
                                Icon(Icons.mic_none_outlined, size: 48, color: Colors.grey[300]),
                                const SizedBox(height: 12),
                                const Text('Handa na ang workspace mo.', style: TextStyle(color: Color(0xFF94A3B8), fontSize: 14)),
                              ],
                            ),
                          )
                        : ListView.builder(
                            physics: const BouncingScrollPhysics(),
                            itemCount: _savedNotes.length,
                            itemBuilder: (context, index) {
                              // Paghiwalayin ang timestamp at ang actual text gamit ang delimiter natin
                              final parts = _savedNotes[index].split('===');
                              final String dateText = parts.length > 1 ? parts[0] : "Kamakailan";
                              final String noteContent = parts.length > 1 ? parts[1] : _savedNotes[index];

                              return Container(
                                margin: const EdgeInsets.symmetric(horizontal: 16, vertical: 6),
                                decoration: BoxDecoration(
                                  color: Colors.white,
                                  borderRadius: BorderRadius.circular(14),
                                  border: Border.all(color: const Color(0xFFF1F5F9)),
                                  boxShadow: [
                                    BoxShadow(
                                      color: Colors.black.withOpacity(0.01),
                                      blurRadius: 8,
                                      offset: const Offset(0, 2),
                                    )
                                  ],
                                ),
                                child: ListTile(
                                  contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 6),
                                  title: Text(
                                    noteContent, 
                                    maxLines: 1, 
                                    overflow: TextOverflow.ellipsis,
                                    style: const TextStyle(fontWeight: FontWeight.w600, color: Color(0xFF1E293B), fontSize: 15),
                                  ),
                                  subtitle: Padding(
                                    padding: const EdgeInsets.only(top: 4.0),
                                    child: Text(dateText, style: const TextStyle(fontSize: 12, color: Color(0xFF94A3B8), fontWeight: FontWeight.w500)),
                                  ),
                                  leading: const CircleAvatar(
                                    backgroundColor: Color(0xFFEFF6FF),
                                    child: Icon(Icons.description, color: Color(0xFF3B82F6), size: 20),
                                  ),
                                  trailing: Row(
                                    mainAxisSize: MainAxisSize.min,
                                    children: [
                                      IconButton(
                                        icon: const Icon(Icons.share_outlined, color: Color(0xFF64748B), size: 20),
                                        onPressed: () => Share.share(noteContent),
                                      ),
                                      IconButton(
                                        icon: const Icon(Icons.delete_outline, color: Colors.redAccent, size: 20),
                                        onPressed: () => _deleteNote(index),
                                      ),
                                    ],
                                  ),
                                  onTap: () => _openNote(dateText, noteContent),
                                ),
                              );
                            },
                          ),
                  ),
                  const SizedBox(height: 95),
                ],
              ),
              floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
              floatingActionButton: FloatingActionButton.large(
                onPressed: _isListening ? _stopListening : _startListening,
                backgroundColor: _isListening ? const Color(0xFFEF4444) : const Color(0xFF0F172A),
                elevation: 4,
                shape: const CircleBorder(),
                child: Icon(_isListening ? Icons.stop_rounded : Icons.mic_rounded, color: Colors.white, size: 38),
              ),
            );
          }
        }
        EOF

    - name: Inject Upgraded pubspec.yaml with Sharing Utilities
      run: |
        cat << 'EOF' > pubspec.yaml
        name: choynotes
        description: "An AI-powered meeting recorder app."
        publish_to: 'none'
        version: 1.0.0+1

        environment:
          sdk: '>=3.0.0 <4.0.0'

        dependencies:
          flutter:
            sdk: flutter
          cupertino_icons: ^1.0.6
          permission_handler: ^11.3.1
          path_provider: ^2.1.3
          speech_to_text: ^7.4.0
          share_plus: ^7.2.1
          intl: ^0.19.0

        dev_dependencies:
          flutter_test:
            sdk: flutter
          flutter_lints: ^3.0.0
          flutter_launcher_icons: ^0.13.1

        flutter:
          uses-material-design: true

        flutter_launcher_icons:
          android: "launcher_icon"
          image_path: "app_icon.png"
        EOF

    - name: Configure Modern Manifest for Voice Speech Queries
      run: |
        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.INTERNET" />
            
            <queries>
                <intent>
                    <action android:name="android.speech.RecognitionService" />
                </intent>
            </queries>

            <application
                android:label="ChoyNotes"
                android:name="${applicationName}"
                android:icon="@mipmap/launcher_icon">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:launchMode="singleTop"
                    android:theme="@style/LaunchTheme"
                    android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                    android:hardwareAccelerated="true"
                    android:windowSoftInputMode="adjustResize">
                    <meta-data
                      android:name="io.flutter.embedding.android.NormalTheme"
                      android:resource="@style/NormalTheme"
                      />
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
                <meta-data
                    android:name="flutterEmbedding"
                    android:value="2" />
            </application>
        </manifest>
        EOF

    - name: Safely Inject Namespace into Flutter-Generated Build Script
      run: |
        if [ -f "android/app/build.gradle.kts" ]; then
          sed -i '/android {/a \    namespace = "com.choynotes.app"' android/app/build.gradle.kts
        elif [ -f "android/app/build.gradle" ]; then
          sed -i '/android {/a \    namespace "com.choynotes.app"' android/app/build.gradle
        fi

    - name: Fetch Flutter Dependencies
      run: flutter pub get

    - name: Global Gradle Safety Patch (Fix JCenter & Buildscript Errors)
      run: |
        find ~/.pub-cache/hosted/pub.dev/speech_to_text-* -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} + || true
        find ~/.pub-cache/hosted/pub.dev/speech_to_text-* -name "build.gradle" -exec sed -i 's/maven { url "https:\/\/jcenter.bintray.com" }/mavenCentral()/g' {} + || true

    - name: Generate Custom Launcher Icons
      run: flutter pub run flutter_launcher_icons

    - name: Build Clean APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChoyNotes-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
