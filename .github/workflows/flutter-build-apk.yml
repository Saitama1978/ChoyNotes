name: Build ChoyNotes APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Auto-generate Clean Android Project
      run: flutter create . --overwrite --org com.choynotes.app

    - name: Inject Clean ChoyNotes App Code
      run: |
        cat << 'EOF' > lib/main.dart
        import 'dart:io';
        import 'package:flutter/material.dart';
        import 'package:permission_handler/permission_handler.dart';
        import 'package:path_provider/path_provider.dart';

        void main() {
          runApp(const ChoyNotesApp());
        }

        class ChoyNotesApp extends StatelessWidget {
          const ChoyNotesApp({super.key});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              title: 'ChoyNotes',
              debugShowCheckedModeBanner: false,
              theme: ThemeData(
                colorScheme: ColorScheme.fromSeed(seedColor: Colors.blueAccent),
                useMaterial3: true,
              ),
              home: const HomeScreen(),
            );
          }
        }

        class HomeScreen extends StatefulWidget {
          const HomeScreen({super.key});

          @override
          State<HomeScreen> createState() => _HomeScreenState();
        }

        class _HomeScreenState extends State<HomeScreen> {
          bool _isRecording = false;
          String _statusText = "Handa nang mag-record ng iyong mga pagpupulong.";
          List<String> _savedNotes = [];

          @override
          void initState() {
            super.initState();
            _loadNotes();
          }

          void _toggleRecording() async {
            if (!_isRecording) {
              var status = await Permission.microphone.request();
              if (status.isGranted) {
                setState(() {
                  _isRecording = true;
                  _statusText = "🎤 Nagre-record na... Ang iyong boses ay ligtas na pinoproseso.";
                });
              } else {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Kailangan ng permiso sa Mic para mag-record.')),
                );
              }
            } else {
              setState(() {
                _isRecording = false;
                _statusText = "Huminto ang pag-record. Handa nang i-save.";
              });
            }
          }

          void _saveNote() async {
            String noteContent = "Meeting Note #${_savedNotes.length + 1}: Naganap ang recording noong ${DateTime.now().toString().substring(0,16)}";
            setState(() {
              _savedNotes.add(noteContent);
              _statusText = "Handa nang mag-record ng iyong mga pagpupulong.";
            });
            final directory = await getApplicationDocumentsDirectory();
            final file = File('${directory.path}/notes.txt');
            await file.writeAsString(_savedNotes.join('\n---\n'));
            ScaffoldMessenger.of(context).showSnackBar(
              const SnackBar(content: Text('Na-save na ang iyong meeting note!')),
            );
          }

          void _loadNotes() async {
            try {
              final directory = await getApplicationDocumentsDirectory();
              final file = File('${directory.path}/notes.txt');
              if (await file.exists()) {
                String contents = await file.readAsString();
                setState(() {
                  _savedNotes = contents.split('\n---\n').where((s) => s.trim().isNotEmpty).toList();
                });
              }
            } catch (e) {
              print(e);
            }
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(
                title: const Text('ChoyNotes - AI Recorder', style: TextStyle(fontWeight: FontWeight.bold)),
                backgroundColor: Colors.blueAccent,
                foregroundColor: Colors.white,
                centerTitle: true,
              ),
              body: Column(
                children: [
                  Expanded(
                    flex: 3,
                    child: Container(
                      padding: const EdgeInsets.all(16),
                      margin: const EdgeInsets.all(16),
                      decoration: BoxDecoration(
                        color: Colors.grey[100],
                        border: Border.all(color: Colors.blueAccent.withOpacity(0.5)),
                        borderRadius: BorderRadius.circular(12),
                      ),
                      child: Center(
                        child: Text(
                          _statusText,
                          textAlign: TextAlign.center,
                          style: const TextStyle(fontSize: 18, color: Colors.black87),
                        ),
                      ),
                    ),
                  ),
                  Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 16.0),
                    child: SizedBox(
                      width: double.infinity,
                      height: 50,
                      child: ElevatedButton.icon(
                        onPressed: _isRecording ? null : _saveNote,
                        icon: const Icon(Icons.save),
                        label: const Text('I-save ang Note', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                        style: ElevatedButton.styleFrom(
                          backgroundColor: Colors.green,
                          foregroundColor: Colors.white,
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8)),
                        ),
                      ),
                    ),
                  ),
                  const SizedBox(height: 10),
                  const Divider(),
                  const Padding(
                    padding: EdgeInsets.all(8.0),
                    child: Text('Mga Na-save na Transcripts:', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                  ),
                  Expanded(
                    flex: 3,
                    child: _savedNotes.isEmpty
                        ? const Center(child: Text('Wala pang na-save na notes.', style: TextStyle(color: Colors.grey)))
                        : ListView.builder(
                            itemCount: _savedNotes.length,
                            itemBuilder: (context, index) {
                              return Card(
                                margin: const EdgeInsets.symmetric(horizontal: 16, vertical: 4),
                                elevation: 2,
                                child: ListTile(
                                  title: Text(_savedNotes[index]),
                                  leading: const Icon(Icons.audio_file, color: Colors.blueAccent),
                                ),
                              );
                            },
                          ),
                  ),
                  const SizedBox(height: 80),
                ],
              ),
              floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
              floatingActionButton: FloatingActionButton.large(
                onPressed: _toggleRecording,
                backgroundColor: _isRecording ? Colors.red : Colors.blueAccent,
                child: Icon(_isRecording ? Icons.stop : Icons.mic, color: Colors.white, size: 36),
              ),
            );
          }
        }
        EOF

    - name: Inject Stable pubspec.yaml
      run: |
        cat << 'EOF' > pubspec.yaml
        name: choynotes
        description: "An AI-powered meeting recorder app."
        publish_to: 'none'
        version: 1.0.0+1

        environment:
          sdk: '>=3.0.0 <4.0.0'

        dependencies:
          flutter:
            sdk: flutter
          cupertino_icons: ^1.0.6
          permission_handler: ^11.3.1
          path_provider: ^2.1.3

        dev_dependencies:
          flutter_test:
            sdk: flutter
          flutter_lints: ^3.0.0

        flutter:
          uses-material-design: true
        EOF

    - name: Setup Android Permissions
      run: |
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

    - name: Install Safe Dependencies
      run: flutter pub get

    - name: Build Clean APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChoyNotes-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
