name: Build ChoyNotes APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Nuke and Recreate Clean Project Environment
      run: |
        rm -rf android ios web windows macos linux
        flutter create . --org com.choynotes.app --project-name choynotes

    - name: Inject Ultimate All-In-One ChoyNotes App Code
      run: |
        cat << 'EOF' > lib/main.dart
        import 'dart:io';
        import 'package:flutter/material.dart';
        import 'package:permission_handler/permission_handler.dart';
        import 'package:path_provider/path_provider.dart';
        import 'package:speech_to_text/speech_to_text.dart';
        import 'package:share_plus/share_plus.dart';
        import 'package:intl/intl.dart';
        import 'package:pdf/pdf.dart';
        import 'package:pdf/widgets.dart' as pw;
        import 'package:printing/printing.dart';

        void main() {
          runApp(const ChoyNotesApp());
        }

        class ChoyNotesApp extends StatefulWidget {
          const ChoyNotesApp({super.key});

          @override
          State<ChoyNotesApp> createState() => _ChoyNotesAppState();
        }

        class _ChoyNotesAppState extends State<ChoyNotesApp> {
          bool _isDarkMode = false;

          void toggleTheme() {
            setState(() {
              _isDarkMode = !_isDarkMode;
            });
          }

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              title: 'ChoyNotes Pro',
              debugShowCheckedModeBanner: false,
              themeMode: _isDarkMode ? ThemeMode.dark : ThemeMode.light,
              theme: ThemeData(
                useMaterial3: true,
                colorScheme: ColorScheme.fromSeed(
                  seedColor: const Color(0xFF0F172A),
                  brightness: Brightness.light,
                ),
                scaffoldBackgroundColor: const Color(0xFFF8FAFC),
              ),
              darkTheme: ThemeData(
                useMaterial3: true,
                colorScheme: ColorScheme.fromSeed(
                  seedColor: const Color(0xFF0F172A),
                  brightness: Brightness.dark,
                ),
                scaffoldBackgroundColor: const Color(0xFF0F172A),
              ),
              home: HomeScreen(onThemeToggle: toggleTheme, isDarkMode: _isDarkMode),
            );
          }
        }

        class HomeScreen extends StatefulWidget {
          final VoidCallback onThemeToggle;
          final bool isDarkMode;
          const HomeScreen({super.key, required this.onThemeToggle, required this.isDarkMode});

          @override
          State<HomeScreen> createState() => _HomeScreenState();
        }

        class _HomeScreenState extends State<HomeScreen> {
          final SpeechToText _speechToText = SpeechToText();
          final TextEditingController _textController = TextEditingController();
          final TextEditingController _searchController = TextEditingController();
          
          bool _isListening = false;
          List<String> _savedNotes = [];
          List<String> _filteredNotes = [];
          int? _editingIndex; 
          bool _shouldBeListening = false; 
          
          String _selectedCategory = 'General';
          final List<String> _categories = ['General', 'School', 'Work', 'Personal'];

          @override
          void initState() {
            super.initState();
            _initSpeech();
            _loadNotes();
            _textController.text = "Tap the microphone below and speak to transcribe...";
            _searchController.addListener(_filterNotesList);
          }

          @override
          void dispose() {
            _textController.dispose();
            _searchController.dispose();
            super.dispose();
          }

          void _initSpeech() async {
            try {
              await _speechToText.initialize(
                onError: (error) {
                  if (_shouldBeListening && !error.errorMsg.contains('error_client')) {
                    _restartListeningLoop();
                  }
                },
                onStatus: (status) {
                  if (status == 'notListening' && _shouldBeListening) {
                    _restartListeningLoop();
                  }
                },
              );
            } catch (e) {
              debugPrint("Speech init error: $e");
            }
          }

          void _startListening() async {
            var status = await Permission.microphone.request();
            if (status.isGranted) {
              bool available = await _speechToText.initialize();
              if (available) {
                setState(() {
                  _isListening = true;
                  _shouldBeListening = true;
                  if (_textController.text.startsWith("Tap the microphone")) {
                    _textController.clear();
                  }
                });
                _executeListeningEngine();
              }
            } else {
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('Microphone permission required.')),
              );
            }
          }

          void _executeListeningEngine() async {
            if (!_shouldBeListening) return;
            await _speechToText.listen(
              onResult: (result) {
                setState(() {
                  _textController.text = result.recognizedWords;
                });
              },
              listenFor: const Duration(hours: 1),
              pauseFor: const Duration(minutes: 10),
              listenOptions: SpeechListenOptions(partialResults: true, cancelOnError: false),
            );
          }

          void _restartListeningLoop() async {
            if (!_shouldBeListening) return;
            await Future.delayed(const Duration(milliseconds: 300));
            _executeListeningEngine();
          }

          void _stopListening() async {
            setState(() {
              _shouldBeListening = false;
              _isListening = false;
            });
            await _speechToText.stop();
          }

          void _saveNote() async {
            final text = _textController.text.trim();
            if (text.isEmpty || text.startsWith("Tap the microphone")) return;

            final String timestamp = DateFormat('MMM dd, yyyy • hh:mm a').format(DateTime.now());
            final String formattedNote = "$timestamp===$_selectedCategory===$text";

            setState(() {
              if (_editingIndex != null) {
                int trueIndex = _savedNotes.indexOf(_filteredNotes[_editingIndex!]);
                if (trueIndex != -1) _savedNotes[trueIndex] = formattedNote;
                _editingIndex = null;
              } else {
                _savedNotes.insert(0, formattedNote);
              }
              _textController.text = "Tap the microphone below and speak to transcribe...";
              _filterNotesList();
            });

            await _saveToStorage();
            ScaffoldMessenger.of(context).showSnackBar(
              const SnackBar(content: Text('Transcript successfully saved!'), backgroundColor: Color(0xFF10B981)),
            );
          }

          void _startEditing(int index, String currentText, String currentCat) {
            setState(() {
              _editingIndex = index;
              _textController.text = currentText;
              if (_categories.contains(currentCat)) _selectedCategory = currentCat;
            });
            ScaffoldMessenger.of(context).showSnackBar(
              const SnackBar(content: Text('Loaded into editor.'), backgroundColor: Color(0xFF3B82F6)),
            );
          }

          Future<void> _saveToStorage() async {
            final directory = await getApplicationDocumentsDirectory();
            final file = File('${directory.path}/choynotes_v2.txt');
            await file.writeAsString(_savedNotes.join('\n---\n'));
          }

          void _loadNotes() async {
            try {
              final directory = await getApplicationDocumentsDirectory();
              final file = File('${directory.path}/choynotes_v2.txt');
              if (await file.exists()) {
                String contents = await file.readAsString();
                setState(() {
                  _savedNotes = contents.split('\n---\n').where((s) => s.trim().isNotEmpty).toList();
                  _filteredNotes = List.from(_savedNotes);
                });
              }
            } catch (e) {
              debugPrint("Error loading notes: $e");
            }
          }

          void _filterNotesList() {
            final query = _searchController.text.toLowerCase();
            setState(() {
              if (query.isEmpty) {
                _filteredNotes = List.from(_savedNotes);
              } else {
                _filteredNotes = _savedNotes.where((note) {
                  return note.toLowerCase().contains(query);
                }).toList();
              }
            });
          }

          void _deleteNote(int index) async {
            setState(() {
              String target = _filteredNotes[index];
              _savedNotes.remove(target);
              if (_editingIndex == index) _editingIndex = null;
              _filterNotesList();
            });
            await _saveToStorage();
          }

          void _generatePDF(String date, String category, String text) async {
            final pdf = pw.Document();
            pdf.addPage(
              pw.Page(
                pageFormat: PdfPageFormat.a4,
                build: (pw.Context context) {
                  return pw.Padding(
                    padding: const pw.EdgeInsets.all(24),
                    child: pw.Column(
                      cross: pw.CrossAxisAlignment.start,
                      children: [
                        pw.Text('ChoyNotes Pro Document Report', style: pw.TextStyle(fontSize: 24, fontWeight: pw.FontWeight.bold)),
                        pw.Divider(),
                        pw.SizedBox(height: 10),
                        pw.Text('Date: $date', style: const pw.TextStyle(fontSize: 12)),
                        pw.Text('Category: $category', style: const pw.TextStyle(fontSize: 12)),
                        pw.SizedBox(height: 20),
                        pw.Text(text, style: const pw.TextStyle(fontSize: 14)),
                      ],
                    ),
                  );
                },
              ),
            );
            await Printing.layoutPdf(onLayout: (PdfPageFormat format) async => pdf.save());
          }

          void _showAISummary(String fullText) {
            List<String> sentences = fullText.split(RegExp(r'(?<=[.!?])\s+'));
            List<String> summaryPoints = [];
            
            for (var sentence in sentences) {
              if (sentence.trim().length > 15 && summaryPoints.length < 3) {
                summaryPoints.add("• ${sentence.trim()}");
              }
            }

            if (summaryPoints.isEmpty) {
              summaryPoints.add("• Context is too brief to isolate key operational points.");
            }

            showDialog(
              context: context,
              builder: (context) => AlertDialog(
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                title: const Row(
                  children: [
                    Icon(Icons.auto_awesome, color: Colors.purpleAccent),
                    SizedBox(width: 8),
                    Text('AI Quick Summary', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                  ],
                ),
                content: Column(
                  mainAxisSize: MainAxisSize.min,
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: summaryPoints.map((pt) => Padding(
                    padding: const EdgeInsets.symmetric(vertical: 4.0),
                    child: Text(pt, style: const TextStyle(fontSize: 14, height: 1.4)),
                  )).toList(),
                ),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.pop(context),
                    child: const Text('Got It', style: TextStyle(fontWeight: FontWeight.bold)),
                  )
                ],
              ),
            );
          }

          void _openNote(int index, String date, String category, String text) {
            showDialog(
              context: context,
              builder: (context) => AlertDialog(
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                title: Row(
                  children: [
                    const Icon(Icons.description, color: Color(0xFF3B82F6)),
                    const SizedBox(width: 8),
                    Expanded(
                      child: Text("$category\n$date", style: const TextStyle(fontSize: 12, color: Colors.grey)),
                    ),
                  ],
                ),
                content: SingleChildScrollView(
                  child: Text(text, style: const TextStyle(fontSize: 15, height: 1.5)),
                ),
                actions: [
                  IconButton(
                    icon: const Icon(Icons.auto_awesome, color: Colors.purpleAccent),
                    tooltip: 'AI Summary',
                    onPressed: () {
                      Navigator.pop(context);
                      _showAISummary(text);
                    },
                  ),
                  IconButton(
                    icon: const Icon(Icons.picture_as_pdf, color: Colors.redAccent),
                    tooltip: 'Export PDF',
                    onPressed: () {
                      Navigator.pop(context);
                      _generatePDF(date, category, text);
                    },
                  ),
                  IconButton(
                    icon: const Icon(Icons.edit, color: Colors.amber),
                    onPressed: () {
                      Navigator.pop(context);
                      _startEditing(index, text, category);
                    },
                  ),
                  IconButton(
                    icon: const Icon(Icons.share, color: Colors.blue),
                    onPressed: () {
                      Navigator.pop(context);
                      Share.share(text);
                    },
                  ),
                  TextButton(
                    onPressed: () => Navigator.pop(context),
                    child: const Text('Close'),
                  ),
                ],
              ),
            );
          }

          @override
          Widget build(BuildContext context) {
            final isDark = widget.isDarkMode;
            return Scaffold(
              appBar: AppBar(
                title: const Text('ChoyNotes Pro', style: TextStyle(fontWeight: FontWeight.w800)),
                backgroundColor: isDark ? const Color(0xFF1E293B) : const Color(0xFF0F172A),
                foregroundColor: Colors.white,
                centerTitle: true,
                actions: [
                  IconButton(
                    icon: Icon(isDark ? Icons.light_mode : Icons.dark_mode),
                    onPressed: widget.onThemeToggle,
                  )
                ],
              ),
              body: Column(
                children: [
                  Container(
                    width: double.infinity,
                    padding: const EdgeInsets.symmetric(vertical: 10, horizontal: 16),
                    color: isDark ? const Color(0xFF0F172A) : const Color(0xFF1E293B),
                    child: Center(
                      child: Text(
                        'Architected by: Renante Fullo',
                        style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 13),
                      ),
                    ),
                  ),

                  Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 16.0, vertical: 8.0),
                    child: Row(
                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                      children: [
                        const Text('Select Category:', style: TextStyle(fontWeight: FontWeight.w600)),
                        DropdownButton<String>(
                          value: _selectedCategory,
                          items: _categories.map((String cat) {
                            return DropdownMenuItem<String>(value: cat, child: Text(cat));
                          }).toList(),
                          onChanged: (val) {
                            if (val != null) setState(() => _selectedCategory = val);
                          },
                        )
                      ],
                    ),
                  ),

                  Expanded(
                    flex: 3,
                    child: Container(
                      padding: const EdgeInsets.all(16),
                      margin: const EdgeInsets.symmetric(horizontal: 16),
                      decoration: BoxDecoration(
                        color: isDark ? const Color(0xFF1E293B) : Colors.white,
                        borderRadius: BorderRadius.circular(16),
                        border: Border.all(color: _editingIndex != null ? Colors.amber : Colors.grey.shade300),
                      ),
                      child: TextField(
                        controller: _textController,
                        maxLines: null,
                        style: TextStyle(fontSize: 16, color: isDark ? Colors.white : Colors.black),
                        decoration: const InputDecoration(border: InputBorder.none),
                        onTap: () {
                          if (_textController.text.startsWith("Tap the microphone")) {
                            _textController.clear();
                          }
                        },
                      ),
                    ),
                  ),

                  Padding(
                    padding: const EdgeInsets.all(16.0),
                    child: Row(
                      children: [
                        if (_editingIndex != null) ...[
                          Expanded(
                            child: OutlinedButton(
                              onPressed: () {
                                setState(() {
                                  _editingIndex = null;
                                  _textController.text = "Tap the microphone below and speak to transcribe...";
                                });
                              },
                              style: OutlinedButton.styleFrom(side: const BorderSide(color: Colors.red)),
                              child: const Text('Cancel', style: TextStyle(color: Colors.red)),
                            ),
                          ),
                          const SizedBox(width: 12),
                        ],
                        Expanded(
                          flex: 2,
                          child: ElevatedButton.icon(
                            onPressed: _isListening ? null : _saveNote,
                            icon: Icon(_editingIndex != null ? Icons.check : Icons.bookmark),
                            label: Text(_editingIndex != null ? 'Update Note' : 'Save Transcript'),
                            style: ElevatedButton.styleFrom(
                              backgroundColor: _editingIndex != null ? Colors.amber.shade700 : const Color(0xFF3B82F6),
                              foregroundColor: Colors.white,
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),

                  Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 16.0, vertical: 4.0),
                    child: TextField(
                      controller: _searchController,
                      decoration: InputDecoration(
                        hintText: 'Search notes...',
                        prefixIcon: const Icon(Icons.search),
                        contentPadding: const EdgeInsets.symmetric(vertical: 0),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        filled: true,
                        fillColor: isDark ? const Color(0xFF1E293B) : Colors.grey.shade100,
                      ),
                    ),
                  ),

                  Expanded(
                    flex: 4,
                    child: _filteredNotes.isEmpty
                        ? const Center(child: Text('No notes found.', style: TextStyle(color: Colors.grey)))
                        : ListView.builder(
                            itemCount: _filteredNotes.length,
                            itemBuilder: (context, index) {
                              final parts = _filteredNotes[index].split('===');
                              String dateText = "Recent";
                              String categoryText = "General";
                              String noteContent = _filteredNotes[index];

                              if (parts.length == 3) {
                                dateText = parts[0];
                                categoryText = parts[1];
                                noteContent = parts[2];
                              } else if (parts.length == 2) {
                                dateText = parts[0];
                                noteContent = parts[1];
                              }

                              return Card(
                                margin: const EdgeInsets.symmetric(horizontal: 16, vertical: 4),
                                color: isDark ? const Color(0xFF1E293B) : Colors.white,
                                child: ListTile(
                                  title: Text(noteContent, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.bold)),
                                  subtitle: Text("$categoryText • $dateText", style: const TextStyle(fontSize: 11)),
                                  trailing: Row(
                                    mainAxisSize: MainAxisSize.min,
                                    children: [
                                      IconButton(icon: const Icon(Icons.picture_as_pdf, color: Colors.redAccent, size: 20), onPressed: () => _generatePDF(dateText, categoryText, noteContent)),
                                      IconButton(icon: const Icon(Icons.delete, color: Colors.red, size: 20), onPressed: () => _deleteNote(index)),
                                    ],
                                  ),
                                  onTap: () => _openNote(index, dateText, categoryText, noteContent),
                                ),
                              );
                            },
                          ),
                  ),
                  const SizedBox(height: 80),
                ],
              ),
              floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
              floatingActionButton: FloatingActionButton(
                onPressed: _isListening ? _stopListening : _startListening,
                backgroundColor: _isListening ? Colors.red : const Color(0xFF0F172A),
                shape: const CircleBorder(),
                child: Icon(_isListening ? Icons.stop : Icons.mic, color: Colors.white),
              ),
            );
          }
        }
        EOF

    - name: Inject Upgraded pubspec.yaml with PDF and Utilities
      run: |
        cat << 'EOF' > pubspec.yaml
        name: choynotes
        description: "An AI-powered meeting recorder app."
        publish_to: 'none'
        version: 1.0.0+1

        environment:
          sdk: '>=3.0.0 <4.0.0'

        dependencies:
          flutter:
            sdk: flutter
          cupertino_icons: ^1.0.6
          permission_handler: ^11.3.1
          path_provider: ^2.1.3
          speech_to_text: ^7.4.0
          share_plus: ^7.2.1
          intl: ^0.19.0
          pdf: ^3.10.8
          printing: ^5.11.1

        dev_dependencies:
          flutter_test:
            sdk: flutter
          flutter_lints: ^3.0.0
          flutter_launcher_icons: ^0.13.1

        flutter:
          uses-material-design: true

        flutter_launcher_icons:
          android: "launcher_icon"
          image_path: "app_icon.png"
        EOF

    - name: Configure Modern Manifest for Voice Speech Queries
      run: |
        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.INTERNET" />
            
            <queries>
                <intent>
                    <action android:name="android.speech.RecognitionService" />
                </intent>
            </queries>

            <application
                android:label="ChoyNotes"
                android:name="${applicationName}"
                android:icon="@mipmap/launcher_icon">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:launchMode="singleTop"
                    android:theme="@style/LaunchTheme"
                    android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                    android:hardwareAccelerated="true"
                    android:windowSoftInputMode="adjustResize">
                    <meta-data
                      android:name="io.flutter.embedding.android.NormalTheme"
                      android:resource="@style/NormalTheme"
                      />
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
                <meta-data
                    android:name="flutterEmbedding"
                    android:value="2" />
            </application>
        </manifest>
        EOF

    - name: Force Global Subprojects SDK Overrides
      run: |
        cat << 'EOF' >> android/build.gradle

        subprojects {
            afterEvaluate { project ->
                if (project.hasProperty('android')) {
                    project.android {
                        compileSdkVersion 34
                        defaultConfig {
                            targetSdkVersion 34
                        }
                    }
                }
            }
        }
        EOF

    - name: Patch Native Script Injection for Modern Android App Builds
      run: |
        if [ -f "android/app/build.gradle" ]; then
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle
          sed -i '/android {/a \    namespace "com.choynotes.app"' android/app/build.gradle
        elif [ -f "android/app/build.gradle.kts" ]; then
          sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle.kts
          sed -i '/android {/a \    namespace = "com.choynotes.app"' android/app/build.gradle.kts
        fi

    - name: Fetch Flutter Dependencies
      run: flutter pub get

    - name: Patch Third-Party Repositories (Fix JCenter Errors)
      run: |
        find ~/.pub-cache/hosted/pub.dev/speech_to_text-* -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} + || true

    - name: Generate Custom Launcher Icons
      run: flutter pub run flutter_launcher_icons

    - name: Build Assets and Plugins First
      run: flutter build bundle

    - name: Direct Native Gradle Build AssembleRelease
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChoyNotes-Release-APK
        path: android/app/build/outputs/apk/release/app-release.apk
