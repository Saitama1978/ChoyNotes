name: choynotes
description: "An AI-powered meeting recorder and auto-notes taker app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  speech_to_text: ^6.6.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# PANG-ANDROID NA LANG ANG ICON PARA WALANG ERROR
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "app_icon.png"

flutter:
  uses-material-design: true
